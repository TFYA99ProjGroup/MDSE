name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Run ruff check
        run: ruff check .

  test_example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Start MongoDB container
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:latest
          # Vänta tills port 27017 är redo
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB ready"
              break
            fi
            echo "Waiting for MongoDB..."
            sleep 1
          done

      - name: Run regular tests
        env:
          MONGO_URI: "mongodb://localhost:27017"
        run: pytest -m "not mpi"

      - name: Run MPI tests (auto cores)
        env:
          MONGO_URI: "mongodb://localhost:27017"
        run: |
          CORES=$NUMBER_OF_PROCESSORS
          echo "Running MPI with $CORES processes"
          mpirun --oversubscribe -n $CORES pytest -m mpi