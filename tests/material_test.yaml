#MD simulations are written in the format:
#
#---
#Name_Of_simulation:
#  Parameter1: Value1
#  Parameter2: value2
#...
#
#Parameters may be nested, via "Parameter_list" or "Parameter_range"

Copper_nve:
  CRYSTAL:
    TYPE: BULK
    Name: Cu
    Structure: fcc
    Lattice_a: 3.6149
    Cubic: True
  ENSAMBLE:
    Ensamble: NVE
    Temp_list: 
      - 300
  SIMULATION:
    Timestep: 2 #fs
    Length: 10000
    TrajInterval: 5
    Calculator: EMT
Copper_nvt:
  CRYSTAL:
    TYPE: BULK
    Name: Cu
    Structure: fcc
    Lattice_a: 3.6149
    Cubic: True
  ENSAMBLE:
    Ensamble: NVT
    ThermoTime: 100
    Temp_list: 
      - 301
  SIMULATION:
    Timestep: 2 #fs
    Length: 10000
    TrajInterval: 5
    Calculator: EMT
Copper_npt:
  CRYSTAL:
    TYPE: BULK
    Name: Cu
    Structure: fcc
    Lattice_a: 3.6149
    Cubic: True
  ENSAMBLE:
    Ensamble: NPT
    ThermoTime: 100
    BaroTime: 1000
    Pressure: 3.85e-2
    Temp_list: 
      - 302
  SIMULATION:
    Timestep: 2 #fs
    Length: 10000
    TrajInterval: 5
    Calculator: EMT
