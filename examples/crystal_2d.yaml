# Config for simulating a 2D crystal.
twod:
  CRYSTAL:
    TYPE: BULK
    Name: Cu
    Structure: fcc
    Lattice_a: 3.6149
    Cubic: True
    PBC:
      - 1
      - 0
      - 1
    Supercell:
      - 10
      - 1
      - 10
  ENSAMBLE:
    Ensamble: NVE
    Temp: 300
  SIMULATION:
    Timestep: 2 #fs
    Length: 2000
    TrajInterval: 5
    Calculator: EMT
    Create_traj: True
  RESULT:
    Properties:
      - all
