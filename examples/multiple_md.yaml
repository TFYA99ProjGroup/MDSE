# These configuration settings are for running 9 simulations,
# Aluminium, Copper and Gold at 50 K, 300 K and 800 K each.

RunManagerTest:
  Type_list:
    - Al
    - Cu
    - Au
  Temp_list:
    - 50
    - 300
    - 800
  Timestep: 2
  Length: 800
  TrajInterval: 10
  Structure: fcc
  Lattice_a: 3.6
